<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>HBOX</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body>
    <main id="desktop" class="desktop" aria-label="HBOX Entries" tabindex="-1"></main>

    <div class="toolbar">
      <button id="add-entry" class="toolbar-icon add-entry" type="button" aria-label="Add Entry">
        <img src="/assets/icons/add.svg" alt="">
      </button>
      <button id="open-config" class="toolbar-icon config-icon" type="button" aria-label="Open Config" aria-controls="config-menu" aria-expanded="false">
        <img src="/assets/icons/config.svg" alt="">
      </button>
    </div>

    <div id="context-menu" class="context-menu" role="menu" hidden>
      <button type="button" role="menuitem" data-action="folder">Open folder</button>
      <button type="button" role="menuitem" data-action="terminal">Open terminal</button>
      <button id="manage-entry" class="manage-entry" type="button" role="menuitem">Manage Entry</button>
    </div>

    <div id="config-menu" class="context-menu config-menu" role="menu" hidden>
      <button id="restart-server" type="button" role="menuitem">Restart</button>
    </div>

    <div id="search-shell" class="search-shell" hidden>
      <img src="/assets/icons/search.svg" alt="">
      <input id="search" type="text" aria-label="Search Entries" autocomplete="off" spellcheck="false">
    </div>

    <dialog id="entry-details-dialog" class="entry-details-dialog" aria-labelledby="entry-details-title">
      <section class="entry-details-panel">
        <header class="entry-details-header">
          <h2 id="entry-details-title"></h2>
          <button id="close-entry-details" class="close-details" type="button" aria-label="Close">
            <img src="/assets/icons/close.svg" alt="">
          </button>
        </header>

        <dl class="entry-details-list">
          <div>
            <dt>Location</dt>
            <dd id="entry-detail-location" class="detail-path"></dd>
          </div>
          <div>
            <dt>Environment</dt>
            <dd id="entry-detail-environment"></dd>
          </div>
          <div>
            <dt>Availability</dt>
            <dd id="entry-detail-availability"></dd>
          </div>
          <div>
            <dt>Tags</dt>
            <dd id="entry-detail-tags" class="detail-tags"></dd>
          </div>
          <div>
            <dt>Default action</dt>
            <dd id="entry-detail-default"></dd>
          </div>
          <div>
            <dt>Metadata</dt>
            <dd id="entry-detail-metadata"></dd>
          </div>
          <div>
            <dt>Icon source</dt>
            <dd id="entry-detail-icon"></dd>
          </div>
          <div>
            <dt>Entry ID</dt>
            <dd id="entry-detail-id" class="detail-id"></dd>
          </div>
        </dl>

        <footer class="entry-details-footer">
          <button id="remove-entry" class="remove-entry" type="button">Remove Entry</button>
        </footer>
      </section>
    </dialog>
  </body>
</html>
